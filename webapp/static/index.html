<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Petit セットアップ</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Cube Petit セットアップ</h1>
    <span id="mock-badge" class="mock-badge" hidden>MOCK モード(疑似実行)</span>
  </header>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
      <div class="progress-petit" id="progress-petit">
        <svg viewBox="0 0 32 30" width="36" height="34" aria-hidden="true">
          <g class="petit-body">
            <rect x="3" y="2" width="26" height="20" rx="4" fill="#e8830c" stroke="#b45309" stroke-width="1"/>
            <rect x="6" y="5" width="20" height="12" rx="2" fill="#2b2b33"/>
            <circle class="petit-eye" cx="12.5" cy="11" r="2.2" fill="#fff"/>
            <circle class="petit-eye" cx="19.5" cy="11" r="2.2" fill="#fff"/>
          </g>
          <g class="petit-wheel">
            <circle cx="9" cy="25" r="3.4" fill="#3f3f46"/>
            <line x1="9" y1="22.4" x2="9" y2="27.6" stroke="#a1a1aa" stroke-width="1.2"/>
          </g>
          <g class="petit-wheel">
            <circle cx="23" cy="25" r="3.4" fill="#3f3f46"/>
            <line x1="23" y1="22.4" x2="23" y2="27.6" stroke="#a1a1aa" stroke-width="1.2"/>
          </g>
        </svg>
      </div>
    </div>
    <span class="progress-text" id="progress-text"></span>
  </div>

  <main class="layout">
    <nav id="step-list" class="step-list" aria-label="セットアップの進み具合"></nav>

    <section id="step-detail" class="step-detail">
      <p class="placeholder">左のリストからステップを選んでください。</p>
    </section>
  </main>

  <template id="tpl-step-list-item">
    <button type="button" class="step-item">
      <span class="step-icon"></span>
      <span class="step-title"></span>
    </button>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
