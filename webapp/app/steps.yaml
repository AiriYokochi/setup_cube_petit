# Phase 1 (MVP) step definitions for the cube_petit_setup web app.
#
# This file is data, not code: the engine (engine.py) reads it and dispatches
# on "type". Adding a Phase 2 step (device setup, checks, petit) should only
# require adding an entry here plus, if it's a genuinely new "type", a small
# handler in engine.py -- the existing setup_pc.bash / setup_ros.bash /
# setup_dev_tools.sh scripts are called as-is and are not reimplemented here.
#
# i18n: every user-facing "*_ja" key has an "*_en" sibling. The frontend picks
# the one matching the selected language and falls back to _ja when _en is
# missing (so forgetting a translation degrades gracefully, never blanks).

steps:
  - id: prereq
    title_ja: "1. 前提確認"
    title_en: "1. Preflight check"
    description_ja: |
      この機体のPCがセットアップ可能な状態か確認します。
      あわせて、この機体の名前(個体名)と、顔の色を入力してください。
      個体名は cube_petit_yellow のように、色や識別名を英数字とアンダースコアで入力します。
    description_en: |
      Checks that this robot's PC is ready to be set up.
      Also enter this robot's name and its face color here.
      Example robot name: cube_petit_yellow — lowercase letters, digits and
      underscores.
    type: prereq_check
    needs_sudo: false
    skippable: false
    requires_reboot: false
    inputs:
      - id: robot_namespace
        label_ja: "個体名 (robot_namespace)"
        label_en: "Robot name (robot_namespace)"
        placeholder: "cube_petit_yellow"
        type: text
        default: "cube_petit_"
        required: true
        pattern: "^cube_petit_[a-z0-9_]+$"
        help_ja: >-
          半角小文字・数字とアンダースコア(_)のみ、cube_petit_ で始めてください。
          ROSの決まりでハイフン(-)は使えません。PCのホスト名(例: cube-petit-yellow)は
          逆にハイフン区切りなので、綴りが違っていて正常です。
        help_en: >-
          Lowercase letters, digits and underscores (_) only, starting with
          cube_petit_. ROS does not allow hyphens (-). The PC's hostname
          (e.g. cube-petit-yellow) uses hyphens instead — the two spellings
          are meant to differ.
        error_ja: >-
          個体名は cube_petit_yellow のように、半角小文字・数字とアンダースコア(_)だけで
          入力してください(ハイフン - や大文字は使えません)。
        error_en: >-
          Enter the robot name like cube_petit_yellow, using lowercase
          letters, digits and underscores only (no hyphens or capitals).
      - id: face_color
        label_ja: "顔の色"
        label_en: "Face color"
        # type "color": rendered as palette swatches (config/face_colors.yaml,
        # attached server-side as this input's "options") plus a free-text
        # hex field. The saved value is always a resolved "#RRGGBB" hex code
        # -- see main.py's get_state()/_prereq_inputs and save_inputs().
        type: color
        default: ""
        required: true
        pattern: "^#[0-9A-Fa-f]{6}$"
        help_ja: >-
          下から選ぶか、hexカラーコード(例: #ffa500)を直接入力してください。
          この色がロボット起動時の顔の色になります(cube_petit_bringupの
          face_color引数にそのまま渡ります)。
        help_en: >-
          Pick one below, or type a hex color code directly (e.g. #ffa500).
          This becomes the robot's face color at startup (passed straight
          through as cube_petit_bringup's face_color argument).
        error_ja: "顔の色は #ffa500 のような6桁のhexカラーコードで入力してください。"
        error_en: "Face color must be a 6-digit hex color code, like #ffa500."

  - id: pc_setup
    title_ja: "2. PC基本設定"
    title_en: "2. Basic PC setup"
    description_ja: |
      日本語入力・Google Chrome・壁紙・電源設定・自動ログインなどをまとめて設定します
      (setup_pc.bash を実行します)。ネットワーク環境によっては5〜10分程度かかります。
    description_en: |
      Sets up Japanese input, Google Chrome, the wallpaper, power settings and
      auto-login in one go (runs setup_pc.bash). Takes about 5-10 minutes
      depending on your network.
    warning_ja: |
      自動ログインや画面まわりの設定は、最後のステップで再起動したときに反映されます。
    warning_en: |
      Auto-login and display settings take effect after the reboot in the
      final steps.
    type: script
    script: setup_pc.bash
    needs_sudo: true
    skippable: false
    requires_reboot: false

  - id: dev_tools
    title_ja: "3. 開発ツール(任意)"
    title_en: "3. Developer tools (optional)"
    description_ja: |
      GitKraken(Git GUIツール)とVS Code(テキストエディタ)を導入するか選べます。
      開発者以外の方は、どちらもOFFのまま「実行」して進んでください。
      VS Codeを選ぶと、Cube Petit開発用のプロファイル(推奨拡張と設定一式)も
      あわせて自動で入ります。
    description_en: |
      Choose whether to install GitKraken (a Git GUI) and VS Code (a text
      editor). If you are not a developer, just press "Run" with both OFF.
      Picking VS Code also installs the Cube Petit development profile
      (recommended extensions and settings) automatically.
    type: toggle_script
    script: setup_dev_tools.sh
    needs_sudo: true
    skippable: true
    requires_reboot: false
    inputs:
      - id: install_gitkraken
        label_ja: "GitKraken (Git GUIツール) を導入する"
        label_en: "Install GitKraken (Git GUI tool)"
        type: bool
        default: false
        # Command probed by /api/steps/dev_tools/installed: when present the
        # UI shows "already installed (check to reinstall)" instead.
        detect_cmd: gitkraken
      - id: install_vscode
        label_ja: "VS Code (テキストエディタ) を導入する"
        label_en: "Install VS Code (text editor)"
        type: bool
        default: false
        detect_cmd: code
      - id: install_anydesk
        label_ja: "AnyDesk (リモートサポート) を導入する"
        label_en: "Install AnyDesk (remote support)"
        type: bool
        default: false
        detect_cmd: anydesk
        help_ja: >-
          遠隔サポートを受ける予定がある場合だけONにしてください。
          サポート時は、画面に出る接続依頼をあなたが承認したときだけ相手に画面が見えます
          (無人アクセスのパスワードは設定しないでください)。反映には再起動が必要です。
        help_en: >-
          Turn this ON only if you plan to receive remote support. During
          support, your screen is visible only while you approve the incoming
          request on screen (do not set an unattended-access password).
          A reboot is required before it works.

  - id: ros_setup
    title_ja: "4. ROS導入"
    title_en: "4. Install ROS"
    description_ja: |
      ROS 2 JazzyとCube Petitのソフトウェア一式を導入します(setup_ros.bash を実行します)。
      ビルドに時間がかかります(目安15〜40分)。この間、画面を閉じずにお待ちください。
    description_en: |
      Installs ROS 2 Jazzy and the whole Cube Petit software stack (runs
      setup_ros.bash). The build takes a while (roughly 15-40 minutes) —
      please keep this screen open until it finishes.
    type: script_with_precheck
    script: setup_ros.bash
    needs_sudo: true
    skippable: false
    requires_reboot: true
    precheck:
      message_ja: |
        ~/ros に以前の作業の跡(既存のROSワークスペースや、cube_petit_ros のソース一式など)
        が見つかりました。状況に応じて、下から選んでください。
      message_en: |
        Traces of previous work were found in ~/ros (an existing ROS
        workspace, or a cube_petit_ros source tree). Pick the option below
        that fits your situation.
      paths:
        - path: "ros/src/cube_petit_ros"
          label_ja: "ROSワークスペース内 cube_petit_ros"
          label_en: "cube_petit_ros inside the ROS workspace"
        - path: "work/ripvcs"
          label_ja: "ripvcs (ビルド支援ツール)"
          label_en: "ripvcs (build helper tool)"
      # skip / clean are always offered when the precheck fires. build_only /
      # separate_ws are added dynamically by engine.precheck_status() only
      # when they actually apply (source cloned but not built / ~/ros exists)
      # -- see engine.py for that logic.
      choices:
        - id: skip
          label_ja: "このステップをスキップする(すでに導入済みとして次へ進む)"
          label_en: "Skip this step (treat it as already installed)"
        - id: clean
          label_ja: "既存のフォルダを削除してやり直す"
          label_en: "Delete the existing folders and start over"

  - id: reboot
    title_ja: "5. 再起動"
    title_en: "5. Reboot"
    description_ja: |
      権限設定(dialout / video グループ)を反映するため、再起動が必要です。
      下のボタンを押したあと、この機体を再起動してください。
      再起動後、もう一度ターミナルで「./webapp/run.sh」を実行すると、続きから再開します。
    description_en: |
      A reboot is needed to apply the permission changes (dialout / video
      groups). Press the button below, then reboot this robot.
      After the reboot, run "./webapp/run.sh" in a terminal again — the
      wizard resumes right where you left off.
    type: reboot_gate
    needs_sudo: false
    skippable: false
    requires_reboot: true

  - id: env_setup
    title_ja: "6. 環境設定"
    title_en: "6. Environment setup"
    description_ja: |
      ROSの通信設定(ROS_DOMAIN_ID・RMW/CycloneDDS)と、よく使うコマンドのエイリアス
      (01_BRING など)を ~/.bashrc にまとめて書き込みます(setup_bashrc.bash を実行します)。
      あわせて、ROS 2通信(CycloneDDS)の推奨設定ファイルもこの機体に配布します。
    description_en: |
      Writes the ROS communication settings (ROS_DOMAIN_ID, RMW/CycloneDDS)
      and handy command aliases (01_BRING etc.) into ~/.bashrc (runs
      setup_bashrc.bash). Also installs the recommended CycloneDDS
      configuration on this robot.
    type: script
    script: setup_bashrc.bash
    needs_sudo: true
    skippable: false
    requires_reboot: false
    inputs:
      - id: ros_domain_id
        label_ja: "ROS_DOMAIN_ID"
        label_en: "ROS_DOMAIN_ID"
        type: text
        # The static default is a fallback: /api/state overrides it with a
        # value derived from the robot name (see _suggested_domain_id in
        # main.py) so two robots on the same Wi-Fi don't collide on 94 --
        # that actually happened (orange's face showed up on yellow).
        default: "94"
        required: true
        pattern: "^[0-9]{1,3}$"
        help_ja: >-
          同じ場所で複数台を動かすときは、個体ごとに違う番号にしてください
          (個体名から自動で提案しています)。
        help_en: >-
          When several robots run in the same place, give each one a
          different number (this value is auto-suggested from the robot
          name).
        error_ja: "ROS_DOMAIN_ID は0〜999の半角数字で入力してください。"
        error_en: "ROS_DOMAIN_ID must be a number between 0 and 999."
      - id: openai_api_key
        label_ja: "OpenAI APIキー(任意)"
        label_en: "OpenAI API key (optional)"
        type: text
        default: ""
        required: false
        help_ja: "AI会話機能に必要です。あとから ~/.bashrc でも設定できます。"
        help_en: "Needed for the AI conversation features. You can also set it later in ~/.bashrc."

  - id: devices
    title_ja: "7. デバイス設定"
    title_en: "7. Device setup"
    description_ja: |
      機体にUSB機器(IMU・CANケーブル・LiDAR・RealSense・SoundBlaster)を接続してから実行してください。
      それぞれの項目はON/OFFで選べます(setup_devices.bash を実行します)。
      RealSenseはソースからビルドするため、ONの場合は10分以上かかることがあります。
    description_en: |
      Connect the USB devices (IMU, CAN cable, LiDAR, RealSense,
      SoundBlaster) to the robot first, then run this step. Each item can be
      toggled ON/OFF (runs setup_devices.bash). RealSense is built from
      source, so with it ON this can take 10+ minutes.
    type: toggle_script
    script: setup_devices.bash
    needs_sudo: true
    skippable: false
    requires_reboot: false
    inputs:
      - id: wifi
        label_ja: "Wi-Fi優先設定"
        label_en: "Wi-Fi priority settings"
        type: bool
        default: true
      - id: audio
        label_ja: "スピーカー(SoundBlaster)"
        label_en: "Speaker (SoundBlaster)"
        type: bool
        default: true
      - id: imu
        label_ja: "IMU"
        label_en: "IMU"
        type: bool
        default: true
      - id: can
        label_ja: "CAN(モーター通信)"
        label_en: "CAN (motor communication)"
        type: bool
        default: true
      - id: realsense
        label_ja: "RealSense(カメラ、ビルドに10分以上)"
        label_en: "RealSense (camera, 10+ min build)"
        type: bool
        default: true

  - id: bt_controller
    title_ja: "8. Bluetoothコントローラ接続"
    title_en: "8. Bluetooth controller pairing"
    description_ja: |
      ロボットを操作するコントローラをBluetoothでペアリングします。
      コントローラをペアリングモードにしてください(ボタン長押し)。
      準備ができたら「スキャン」を押すと、近くのBluetooth機器が一覧表示されます。
      目的のコントローラの「接続」を押すとペアリング・接続まで自動で行います。
      Tips: スキャン結果には「Wireless Controller」という名前で出てくることが
      多いです(PS系コントローラの標準名)。それらしい名前が見当たらないときは、
      まずこれを探してみてください。
    description_en: |
      Pairs the game controller that drives the robot over Bluetooth.
      Put the controller into pairing mode (hold its pairing button), then
      press "Scan" to list nearby Bluetooth devices. Press "Connect" on your
      controller and pairing + connection happen automatically.
      Tip: PlayStation-style controllers usually show up as
      "Wireless Controller" — look for that name first.
    type: bluetooth
    needs_sudo: false
    skippable: true
    requires_reboot: false

  - id: claude_support
    title_ja: "9. Claude Codeコード支援(任意)"
    title_en: "9. Claude Code assistant (optional)"
    description_ja: |
      AIによるコード支援環境(Claude Code)を導入します。
      Claude(Anthropic)の利用登録と課金が必要です。使わない場合はスキップしてください。
      実行すると: ①Claude Code本体の導入 ②このロボット専用のClaude作業フォルダ
      (作業ログ・計画・記憶の置き場と、Issue/PR作成などの定型スキル入り)の作成
      ③GitHub接続用のSSH鍵の準備、を行います。
      実行が終わると、残りの手順(GitHubリポジトリの作成と公開鍵の登録)が
      この画面に表示されます。
      もう一度実行すると、作業フォルダの共通部分(ガイドやルール)が最新に
      更新されます(あなたの作業ログや記録は変更されません)。
    description_en: |
      Installs the AI coding assistant (Claude Code). This requires an
      Anthropic account and a paid plan — skip this step if you won't use it.
      Running it: 1) installs Claude Code, 2) creates this robot's own
      Claude workspace (a home for worklogs, plans and memory, with
      ready-made skills like issue/PR creation), 3) prepares an SSH key for
      GitHub. When it finishes, the remaining steps (creating a GitHub
      repository and registering the public key) appear on this screen.
      Running it again refreshes the shared parts of the workspace (guides
      and rules) — your own logs and records are never touched.
    type: script
    script: setup_claude_workspace.bash
    needs_sudo: false
    skippable: true
    requires_reboot: false
    # The "update available" badge for this step should also fire when only
    # the workspace template changed (the script itself may be untouched).
    watch_paths:
      - claude_workspace_template
    # Link buttons shown on this step's guide panel (data, not code -- same
    # idea as the "completion" section below: editable without touching JS).
    guide_links:
      about_claude:
        label_ja: "Claude Codeってなに?"
        label_en: "What is Claude Code?"
        url: "https://code.claude.com/docs/ja/overview"
        url_en: "https://code.claude.com/docs/en/overview"
      github_signup:
        label_ja: "GitHubアカウントを作る(持っていない場合)"
        label_en: "Create a GitHub account (if you don't have one)"
        url: "https://github.com/signup"
      new_repo:
        label_ja: "リポジトリを作るページを開く"
        label_en: "Open the new-repository page"
        url: "https://github.com/new"
      ssh_keys:
        label_ja: "公開鍵を登録するページを開く"
        label_en: "Open the SSH-key registration page"
        url: "https://github.com/settings/ssh/new"

  - id: device_check
    title_ja: "10. センサ接続確認"
    title_en: "10. Sensor connection check"
    description_ja: |
      IMU・CAN・LiDAR・Wi-Fi・SoundBlaster・RealSense・Bluetoothコントローラが
      正しく認識されているか、まとめて確認します(udev_check.sh を実行します)。
      NGの項目があっても、この画面から先に進めます。あとで機器を接続し直してから
      「もう一度チェック」を押せば再確認できます。
    description_en: |
      Checks in one go that the IMU, CAN, LiDAR, Wi-Fi, SoundBlaster,
      RealSense and the Bluetooth controller are all recognized (runs
      udev_check.sh). You can continue even if some items fail — reconnect
      the device later and press "Check again" to re-verify.
    type: check
    script: shell_scripts/udev_check.sh
    needs_sudo: false
    skippable: false
    requires_reboot: false

  - id: autostart
    title_ja: "11. 自動起動設定"
    title_en: "11. Auto-start on power-on"
    description_ja: |
      電源を入れたら自動でロボットのソフトウェア(モーター・センサなどの起動一式)が
      立ち上がるように設定します(setup_autostart.bash を実行します)。
      ONのまま実行すると、次回のPC起動から有効になります(いまは起動しません)。
      あとで変えたくなったら、ON/OFFを切り替えてもう一度実行すれば反映されます。
    description_en: |
      Makes the robot's software stack (motors, sensors and friends) start
      automatically when the PC powers on (runs setup_autostart.bash).
      Run it with the toggle ON and it takes effect from the next boot
      (nothing starts right now). To change your mind later, flip the
      toggle and run this step again.
    type: script
    script: setup_autostart.bash
    needs_sudo: false
    skippable: false
    requires_reboot: false
    inputs:
      - id: autostart_enabled
        label_ja: "電源を入れたら自動でロボットを起動する(bringup)"
        label_en: "Start the robot automatically on power-on (bringup)"
        type: bool
        default: true
        help_ja: >-
          次回のPC起動から、モーター・センサが自動で立ち上がります。
          開発用の機体はOFF推奨です。
        help_en: >-
          From the next boot, motors and sensors come up by themselves.
          OFF is recommended for development machines.

  - id: personality
    title_ja: "12. 性格・声の設定(任意)"
    title_en: "12. Personality & voice settings (optional)"
    description_ja: |
      この機体のキャラクター設定(性格・ニックネームなど)と声の設定(音声合成の
      パラメータ)を保存します。設定は ~/.cube_petit/<個体名>/ 以下の
      personality.yaml / voice.yaml に書き込まれます。
      会話機能(cube_petit_chat)や音声合成(text_to_speech)がこの設定を読み込んで
      実際の振る舞いに反映するのは別の対応で行う予定です(今回はここで保存するだけです)。
      入力しなくても、あとからいつでも設定・変更できます。
      すでに設定済みの機体では、保存されている内容がそのままフォームに読み込まれます。
      話し方(感情・声の高さ・速さ・音量)は「▶ 再生」ボタンで、保存前でも実際に
      試し聞きできます(ロボットのプログラムが起動している必要があります)。
    description_en: |
      Saves this robot's character settings (personality, nickname, etc.) and
      voice settings (speech-synthesis parameters) to
      ~/.cube_petit/<robot_namespace>/personality.yaml and voice.yaml.
      Wiring these into the actual conversation (cube_petit_chat) and speech
      synthesis (text_to_speech) behavior is planned as separate follow-up
      work (this step only saves the settings for now).
      You can leave this blank and set it up anytime later.
      If this robot already has settings saved, they are loaded into the form
      as-is. The speech parameters (emotion, pitch, speed, volume) can be
      test-played with the "Play" button even before saving (this requires
      the robot's software to be running).
    type: personality_config
    needs_sudo: false
    skippable: true
    requires_reboot: false
    inputs:
      - id: color
        label_ja: "色(和名)"
        label_en: "Color (Japanese name)"
        placeholder: "ピンク"
        type: text
        default: ""
        required: false
      - id: personality_template
        label_ja: "性格テンプレート"
        label_en: "Personality template"
        type: template_select
        required: false
        help_ja: "選ぶと下の性格・夢・好きなもの等の欄に例文が入ります(そのまま自由に書き換えられます)。選択自体は保存されません。"
        help_en: "Choosing one fills in the personality/dream/favorites fields below with example text (freely editable afterward). The selection itself is not saved."
      - id: personality
        label_ja: "性格"
        label_en: "Personality"
        placeholder: "おっとり"
        type: text
        default: ""
        required: false
      - id: nick_name
        label_ja: "ニックネーム"
        label_en: "Nickname"
        placeholder: "ピンクプチ"
        type: text
        default: ""
        required: false
      - id: dream
        label_ja: "夢"
        label_en: "Dream"
        placeholder: "たくさんの人と繋がって元気を分け与えること"
        type: text
        default: ""
        required: false
      - id: favorite_fruit
        label_ja: "好きな果物"
        label_en: "Favorite fruit"
        placeholder: "いちご"
        type: text
        default: ""
        required: false
      - id: favorite
        label_ja: "好きなもの"
        label_en: "Favorite thing"
        placeholder: "ピンク色のもの"
        type: text
        default: ""
        required: false
      - id: friends
        label_ja: "他の個体との関係性"
        label_en: "Relationship with other robots"
        placeholder: "オレンジ色のキューブプチでよく追いかけっこをしています。ニックネームはオレンジプチです。"
        type: text_list
        default: []
        required: false
        help_ja: "「+ 追加」で何人分でも追加できます。空欄の行は保存されません。"
        help_en: "Add as many as you like with \"+ Add\". Blank rows are not saved."
      - id: first_person_pronoun
        label_ja: "一人称"
        label_en: "First-person pronoun"
        placeholder: "わたし"
        type: text
        default: ""
        required: false
      - id: end_talk
        label_ja: "語尾の傾向"
        label_en: "Speech ending style"
        placeholder: "少し元気でやわらかい感じにします(例:〜だよ!、〜なんだ〜)。"
        type: text
        default: ""
        required: false
      - id: sample_talk
        label_ja: "サンプル発話"
        label_en: "Sample line"
        placeholder: "「こんにちは〜!私はピンクプチだよ!今日はどんなお話をする?」"
        type: text
        default: ""
        required: false
      - id: language
        label_ja: "言語コード"
        label_en: "Language code"
        type: text
        default: "ja"
        required: false
        pattern: "^[a-z]{2}(-[A-Z]{2})?$"
        help_ja: "音声合成の言語コードです(通常は ja のままで構いません)。"
        help_en: "Language code for speech synthesis (usually leave this as ja)."
        error_ja: "言語コードは ja のような形式(小文字2文字)で入力してください。"
        error_en: "Enter the language code as two lowercase letters, e.g. ja."
      - id: speech_emotion
        label_ja: "話し方の感情"
        label_en: "Speech emotion"
        type: select
        default: "normal"
        required: false
        options:
          - id: happy
            label_ja: "うれしい"
            label_en: "Happy"
          - id: normal
            label_ja: "ふつう"
            label_en: "Normal"
          - id: angry
            label_ja: "おこってる"
            label_en: "Angry"
          - id: bashful
            label_ja: "はずかしい"
            label_en: "Bashful"
          - id: sad
            label_ja: "かなしい"
            label_en: "Sad"
        help_ja: "音声合成エンジンが対応している感情はこの5種類だけです。"
        help_en: "The speech-synthesis engine only supports these five emotions."
      - id: speech_emotion_level
        label_ja: "感情の強さ(1〜5)"
        label_en: "Emotion level (1-5)"
        type: slider
        min: 1
        max: 5
        step: 1
        default: 2
        required: false
      - id: speech_pitch
        label_ja: "声の高さ(50〜199)"
        label_en: "Voice pitch (50-199)"
        type: slider
        min: 50
        max: 199
        step: 1
        default: 100
        required: false
      - id: speech_speed
        label_ja: "話す速さ(50〜299)"
        label_en: "Speech speed (50-299)"
        type: slider
        min: 50
        max: 299
        step: 1
        default: 100
        required: false
      - id: speech_volume
        label_ja: "音量(1〜100)"
        label_en: "Volume (1-100)"
        type: slider
        min: 1
        max: 100
        step: 1
        default: 100
        required: false

